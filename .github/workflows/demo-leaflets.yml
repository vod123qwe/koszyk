name: Demo leaflets snapshot

on:
  push:
    branches: ['claude/**']
    paths: ['scripts/demo-leaflets.js', '.github/workflows/demo-leaflets.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev --no-audit --no-fund

      - name: Fetch leaflets
        run: node scripts/demo-leaflets.js

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add demo/leaflets.json
          git diff --cached --quiet && echo "Bez zmian" && exit 0
          git commit -m "chore: demo leaflets snapshot"
          git pull --rebase
          git push
